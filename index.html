<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Painel Frota</title>

<style>

:root{
  --bg:#071029;
  --card:#0b1a3a;
  --table:#0e224d;
  --table-alt:#0c1d40;
  --header:#2c4078;
  --border:#1e2f5c;
  --text:#ffffff;
  --muted:#9fb3ff;
  --green:#00ff9c;
  --yellow:#ffcc00;
  --red:#ff4d4d;
  --lime:#7CFC00;
  --blue:#6284fc;
  --row-height:44px; /* altura estimada por linha nas tabelas */
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

header{
  display:grid;
  grid-template-columns: 180px 1fr 1fr;
  gap:16px;
  justify-content:space-between;
  padding:10px 20px;
  background:#020617;
  align-items:left;
  border-bottom: 1px solid rgba(255,255,255,.1);
}

h1{margin:0;}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
  transition:.2s;
}

main{
  display:grid;
  padding:10px;
  gap:10px;
  height:calc(100vh - 100px);
  overflow:auto;
}

table{
  width:100%;
  table-layout:auto;
  border-collapse:separate;
  border-spacing:0;
}

th,
td{
  padding:8px;
  text-align:left;
  overflow:hidden;
  text-overflow:ellipsis;
  word-wrap:break-word;
  color:#fff;
}

tbody td{
  padding:10px;
  border: 1px solid var(--border);
  background:var(--table);
  text-align:center;
  font-size:16px;
}

tbody tr:nth-child(odd) td{
  background:#0f2147;
}

tbody tr:nth-child(even) td{
  background:#152a57;
}

thead th{
  background:#198754;
  color:#fff;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-size:0.9rem;
  font-weight:700;
  text-align:left;
  vertical-align:middle;
  position:sticky;
  top:0;
  padding:10px;
  border: 1px solid var(--border);
}

.header-left{
  justify-self:start;
  display:flex;
  align-items:center;
  gap:15px;
}

.header-right{
  justify-self:end;
  display:flex;
  align-items:center;
  gap:10px;
}

#clock{
  margin-right:8px;
  color:#ffffff;
  font-size:22px;
  font-weight:700;
  letter-spacing:1px;
}

.logo{
  height:60px;
  width:auto;
}

#toggle-audio.off{
  background:#dc2626;
  color:white;
}

.resumo-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  overflow: visible;
}

/* limita os cards de resumo (veículos e motoristas) a 4 linhas visíveis */
.resumo-grid .card{
  max-height: calc(var(--row-height) * 4 + 64px); /* 4 linhas + cabeçalho/title/espacamento */
  overflow:auto;
}

.resumo-card{
  background:#0b1a3a;
  border-radius:10px;
  padding:10px;
}

.resumo-card h2,
.card h2,
.card-resumo h2{
  margin: -10px -10px 12px -10px;
  padding: 12px;
  text-align: center;
  background:#2c4078;
  color: #fff;
  font-size: 1.1rem;
  font-weight: bold;
  border-radius: 10px 10px 0 0;
  letter-spacing: 1px;
  margin:0;
}

.card{
  background:var(--card);
  border-radius:10px;
  padding:10px;
  overflow:auto;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 4px 20px rgba(0,0,0,.35);
}

.card h2{
  text-align:left;
  margin:0;
  padding:4px 10px;
  font-size:20px;
}

.dual-cards{
  display:flex;
  gap:15px;
  margin-bottom:15px;
  grid-template-columns:1fr 1fr;
  max-height:260px;
  overflow-y:auto;
}

.card-resumo{flex:1;}

/* STATUS */
.livre{color:#00ff9c; font-weight:700;}
.ocupado{color:#ff4d4d; font-weight:700;}
.viagem{color:#d66bff; font-weight:700;}
.manutencao{color:#4da6ff; font-weight:700;}
.andamento{ background:rgba(255,77,77,.15); color:var(--red);}

.actions{
  display:flex;
  gap:10px;
}

.status-icon{
  font-size:24px;
  font-weight:700;
  text-align:center;
}

button.off{
  background:#ff4d4d;
  color:#ffffff;
  box-shadow: 0 0 10px rgba(255,77,77,.5);
}

/* PAINEL, AGENDA E SERVIÇO SOCIAL */

.painel .status-andamento td,
.agenda .status-andamento td,
.social .status-andamento td{
  background:rgba(210, 150, 80);
  color:#FFF;
}

.painel .status-cancelado td,
.agenda .status-cancelado td,
.social .status-cancelado td{
  background:rgba(255,77,77,.10);
  color:#FFF;
}

.painel .status-concluido td,
.agenda .status-concluido td,
.social .status-concluido td{
  background:#32CD32;
  color:#FFF;
}

.painel .status-atendido td,
.agenda .status-atendido td,
.social .status-atendido td{
  background:rgba(0,255,156,.10);
  color:#FFF;
}

.painel .status-manutencao td,
.agenda .status-manutencao td,
.social .status-manutencao td{
  background:rgba(110, 180, 255);
  color:#FFF;
}

.painel .status-viagem td,
.agenda .status-viagem td,
.social .status-viagem td{
  background:rgba(210, 140, 255);
  color:#FFF;
}

</style>

</head>

<body>

<audio id="beep" preload="auto"><source src="./alerta.mp3" type="audio/mpeg"></audio>

<header>

  <div class="header-left">
    <img src="logo.png" class="logo" onerror="this.style.display='none'">
  </div>

  <div class="header-center">
    <h1>Painel Frota</h1>
  </div>

  <div class="header-right">
    <span id="clock"></span>
    <button id="toggle-audio">🔊 SOM ON</button>
    <button onclick="toggleFull()">⛶TELA CHEIA</button>
  </div>
</header>

<!-- ================= MAIN ================= -->

<main id="app"></main>

<script>

/* ================= CONFIG ================= */

const SHEET_ID =
  "14T7zF0likp8YGeycOYBcOs9INY9gvMzpt7SMfghE8P4";

const TABS = [
  { id:"veiculos", title:"VEÍCULOS", sheet:"VEÍCULOS", headers:["TRAIL TXN1I89","CRETA TXJ6F18","CRETA TXJ6F19","CRETA TXJ6F20"] },
  { id:"motoristas", title:"MOTORISTAS", sheet:"MOTORISTAS", headers:["CACIO / 5000366","CELSO DALDEGAN / 5000205","NEIDIVAL / 5000199"] },
  { id:"painel", title:"PAINEL", sheet:"LANÇAMENTOS", headers:["Data","Hora","Empregado","Veículo","Passageiro/ Setor/ Motivo","Itinerário","Status"] },
  { id:"agenda", title:"AGENDA DO DIA", sheet:"AGENDA DO DIA", headers:["Data","Hora","Passageiro","Setor","Motivo","Itinerário","Status"] },
  { id:"social", title:"AGENDA SERVIÇO SOCIAL", sheet:"AGENDA SERVIÇO SOCIAL", headers:["Data","Período","Passageiro","Motivo","Itinerário","Status"] }
];

/* ================= STATUS CONFIG ================= */
const STATUS = {
  atendido:{ icon:'<span style="color:#00ff9c">✔</span>', class:"status-atendido"},
  concluido:{ icon:'<span style="color:#7CFC00">✔</span>', class:"status-concluido"},
  andamento:{ icon:'<span style="color:#ffcc00">⏳</span>', class:"status-andamento"},
  cancelado:{ icon:'<span style="color:#ff4d4d">✖</span>', class:"status-cancelado"},
  manutenção:{ icon:'<span style="color:#ff0000">🔧</span>', class:"status-manutencao"},
  viagem:{ icon:'<span style="color:#ff9800">✈️</span>', class:"status-viagem"}
};

/* ================= HELPERS ================= */
const parseGviz = txt => JSON.parse(txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1));
const getCell = c => c?.f ?? c?.v ?? "";
function formatarData(valor){ if(!valor) return ""; if(valor instanceof Date) return valor.toLocaleDateString("pt-BR"); const texto = String(valor); const match = texto.match(/\d{1,2}\/\d{1,2}\/\d{4}/); return match ? match[0] : texto; }
function getStatusKey(status=""){ status = status.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); if(status.includes("manutencao")) return "manutenção"; if(status.includes("viagem")) return "viagem"; if(status.includes("andamento")) return "andamento"; if(status.includes("atendido")) return "atendido"; if(status.includes("concluido")) return "concluido"; if(status.includes("cancelado")) return "cancelado"; return null; }
function getStatusClass(status){ const key = getStatusKey(status); return STATUS[key]?.class || ""; }
function getStatusIcon(status){ const key = getStatusKey(status); return STATUS[key]?.icon || ""; }

/* ================= FETCH ================= */
async function fetchSheet(sheet){
  try{
    let query = "";
    if(sheet === "LANÇAMENTOS") query = `select B,C,D,E,F,G,X`;
    if(sheet === "AGENDA DO DIA") query = "select B,C,D,E,F,G,H";
    if(sheet === "AGENDA SERVIÇO SOCIAL") query = "select B,C,D,F,G,H";
    if(sheet === "VEÍCULOS") query = "select B,V,M,N";
    if(sheet === "MOTORISTAS") query = "select B,C,D";
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}&headers=1&tq=${encodeURIComponent(query)}&tqx=out:json`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return parseGviz(await res.text());
  }catch(err){ console.error(`Erro na aba ${sheet}:`, err); return { table:{ rows:[] } }; }
}

/* ================= TABLE RENDERS ================= */
function renderTable(headers, rows){
  return `\n<table>\n<thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>\n<tbody>${rows.map(row=>{ const values=(row.c||[]).map(getCell); const status=values.at(-1)?.toLowerCase()||""; const rowClass=getStatusClass(status); const icon=getStatusIcon(status); return `<tr class="${rowClass}">${values.map((v,i)=>`<td class="${i===values.length-1?'status-icon':''}">${i===values.length-1?icon:v}</td>`).join("")}</tr>`; }).join("")}</tbody>\n</table>`;
}

function getDisponibilidade(nome, painelRows, tipo){
  const procurado = String(nome||"").trim().toUpperCase();
  for(const row of painelRows){
    const valores=(row.c||[]).map(getCell);
    const veiculo=String(valores[3]||"").trim().toUpperCase();
    const motorista=String(valores[2]||"").trim().toUpperCase();
    const status=String(valores[6]||"").trim().toUpperCase();
    const encontrado = tipo === "veiculo" ? veiculo === procurado : motorista === procurado;
    if(!encontrado) continue;
    if(status.includes("MANUTENÇÃO") || status.includes("MANUTENCAO")){
      return tipo === "veiculo" ? '<span class="manutencao">🔵 MANUTENÇÃO</span>' : '<span class="livre">🟢 LIVRE</span>';
    }
    if(status.includes("VIAGEM")) return '<span class="viagem">🟣 VIAGEM</span>';
    return '<span class="ocupado">🔴 OCUPADO</span>';
  }
  return '<span class="livre">🟢 LIVRE</span>';
}

function renderVeiculos(rows, painelRows){
  const displayRows = (rows || []).slice(0, 4); // mostra só as primeiras 4 linhas
  const more = (rows || []).length > 4 ? (rows.length - 4) : 0;

  return `
    <table>
      <thead>
        <tr>
          <th>Placa</th>
          <th>Status</th>
          <th>Odômetro</th>
          <th>Combustível</th>
        </tr>
      </thead>
      <tbody>
        ${displayRows.map(row => {
          const v = (row.c || []).map(getCell);
          return `
            <tr>
              <td><strong>${v[0] || ""}</strong></td>
              <td>${getDisponibilidade(v[0], painelRows, "veiculo")}</td>
              <td>${v[2] || ""} km</td>
              <td>⛽ ${v[3] || ""}</td>
            </tr>
          `;
        }).join("")}
      </tbody>
    </table>
    ${more ? `<div class="more-items">+${more} oculto(s)</div>` : ""}
  `;
}

function renderMotoristas(rows, painelRows, linhaFlutuante){
  return `\n<table>\n<thead><tr><th>Motorista</th><th>Status</th><th>Condição</th></tr></thead>\n<tbody>${rows.map(row=>{ const v=(row.c||[]).map(getCell); return `<tr><td><strong>${v[0]||""}</strong></td><td>${getDisponibilidade(v[0], painelRows, "motorista")}</td><td>${v[2]||""}</td></tr>`; }).join("")}${linhaFlutuante}</tbody>\n</table>`;
}

/* ================= UI HELPERS ================= */
function playBeep(){
  const audio = document.getElementById('beep');
  const btn = document.getElementById('toggle-audio');
  if(!audio) return;
  if(btn && btn.classList.contains('off')) return; // muted
  audio.currentTime = 0;
  audio.play().catch(()=>{});
}

function updateClock() {
  const el = document.getElementById("clock");
  if (!el) return;

  const now = new Date();

  const data = now.toLocaleDateString("pt-BR");
  const hora = now.toLocaleTimeString("pt-BR", {
    hour: "2-digit",
    minute: "2-digit"
  });

  el.textContent = `${data} - ${hora}`;
}

function toggleFull(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    el.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
}

/* Toggle audio button */
document.addEventListener('click', e=>{
  if(e.target && e.target.id === 'toggle-audio'){
    e.target.classList.toggle('off');
    e.target.textContent = e.target.classList.contains('off') ? '🔈 SOM OFF' : '🔊 SOM ON';
  }
});

/* ================= LOAD ================= */
let lastHash = "";
let firstLoad = true;

async function loadAll(){
  const app = document.getElementById('app');
  try{
    const results = await Promise.all(TABS.map(t=>fetchSheet(t.sheet)));
    const hash = JSON.stringify(results);
    if(!firstLoad && hash !== lastHash){ playBeep(); }
    firstLoad = false; lastHash = hash;
    app.innerHTML = '';

    const painelIndex = TABS.findIndex(t => t.id === 'painel');
    const agendaIndex = TABS.findIndex(t => t.id === 'agenda');
    const socialIndex = TABS.findIndex(t => t.id === 'social');
    const veiculosIndex = TABS.findIndex(t => t.id === 'veiculos');
    const motoristasIndex = TABS.findIndex(t => t.id === 'motoristas');

    const hoje = (new Date()).toLocaleDateString('pt-BR');

    // painel rows (filter relevant statuses)
    const painelRows = (results[painelIndex].table.rows || []).filter(row=>{
      const v=(row.c||[]).map(getCell);
      const status=String(v[6]||"").toUpperCase().trim();
      return status.includes('AGENDADO') || status.includes('EM ANDAMENTO') || status.includes('VIAGEM') || status.includes('MANUTENÇÃO') || status.includes('MANUTENCAO');
    });

    // sort painel rows by date/time
    painelRows.sort((a,b)=>{
      const va=(a.c||[]).map(getCell); const vb=(b.c||[]).map(getCell);
      const parse = (dataStr, horaStr)=>{
        if(!dataStr) return new Date(0);
        const d = dataStr.includes('/') ? dataStr.split('/') : new Date(dataStr);
        const dia = Array.isArray(d)?d[0]:d.getDate();
        const mes = Array.isArray(d)?d[1]:d.getMonth()+1;
        const ano = Array.isArray(d)?d[2]:d.getFullYear();
        const h = (horaStr||'00:00').split(':');
        return new Date(Number(ano), Number(mes)-1, Number(dia), Number(h[0]||0), Number(h[1]||0));
      };
      return parse(va[0],va[1]) - parse(vb[0],vb[1]);
    });

    // agenda rows for today
    const agendaRows = (results[agendaIndex].table.rows || []).filter(row=>{ const v=(row.c||[]).map(getCell); return String(v[0]||"").trim() === hoje; });
    agendaRows.sort((a,b)=>{ const va=(a.c||[]).map(getCell); const vb=(b.c||[]).map(getCell); return new Date(`${va[0]} ${va[1]}`) - new Date(`${vb[0]} ${vb[1]}`); });

    // social rows for today
    const socialRows = (results[socialIndex].table.rows || []).filter(row=>{ const v=(row.c||[]).map(getCell); return String(v[0]||"").trim() === hoje; });

    const veiculosRows = results[veiculosIndex].table.rows || [];
    const motoristasRows = results[motoristasIndex].table.rows || [];

    // find floating motorista not present in motoristas list
    const motoristaFlutuante = painelRows.find(row=>{ const v=(row.c||[]).map(getCell); const nome=String(v[2]||"").trim(); return !motoristasRows.some(r=>String(((r.c||[])[0]?.f ?? (r.c||[])[0]?.v) || "").trim() === nome); });

    let linhaFlutuante = '';
    if(motoristaFlutuante){
      const v=(motoristaFlutuante.c||[]).map(getCell);
      const nome=String(v[2]||"").trim();
      const status=String(v[6]||"").toUpperCase();
      let textoStatus = '🔴 OCUPADO';
      if(status.includes('VIAGEM')) textoStatus = '✈️ VIAGEM';
      if(status.includes('MANUTENÇÃO') || status.includes('MANUTENCAO')) textoStatus = '🔧 MANUTENÇÃO';
      linhaFlutuante = `<tr><td><strong>${nome}</strong></td><td>${textoStatus}</td><td>USUÁRIO CADASTRADO</td></tr>`;
    }

    // build DOM
    const veiculosCard = document.createElement('div'); veiculosCard.className = 'card';
    veiculosCard.innerHTML = `<h2>${TABS[veiculosIndex].title}</h2>${renderVeiculos(veiculosRows, painelRows)}`;

    const motoristasCard = document.createElement('div'); motoristasCard.className = 'card';
    motoristasCard.innerHTML = `<h2>${TABS[motoristasIndex].title}</h2>${renderMotoristas(motoristasRows, painelRows, linhaFlutuante)}`;

    const painelCard = document.createElement('div'); painelCard.className = 'card';
    painelCard.innerHTML = `<h2>${TABS[painelIndex].title}</h2>${renderTable(TABS[painelIndex].headers, painelRows)}`;

    const agendaCard = document.createElement('div'); agendaCard.className = 'card';
    agendaCard.innerHTML = `<h2>${TABS[agendaIndex].title}</h2>${renderTable(TABS[agendaIndex].headers, agendaRows)}`;

    const socialCard = document.createElement('div'); socialCard.className = 'card';
    socialCard.innerHTML = `<h2>${TABS[socialIndex].title}</h2>${renderTable(TABS[socialIndex].headers, socialRows)}`;

    // Top: Veículos + Motoristas (lado a lado)
    const resumo = document.createElement('div'); resumo.className = 'resumo-grid';
    resumo.appendChild(veiculosCard);
    resumo.appendChild(motoristasCard);

    const mainContainer = document.getElementById('app');
    mainContainer.appendChild(resumo);

    // Then Painel (full width)
    mainContainer.appendChild(painelCard);

    // Agenda do dia (own line)
    mainContainer.appendChild(agendaCard);

    // Agenda Serviço Social (own line)
    mainContainer.appendChild(socialCard);

  }catch(err){ console.error('Erro ao carregar dados:', err); }
}

// initial actions
updateClock(); setInterval(updateClock, 1000);
loadAll(); setInterval(loadAll, 15000);

</script>

</body>
</html>
