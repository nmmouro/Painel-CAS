<!doctype html>
<html lang="pt-BR">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Painel - Frota (GViz)</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />


<style>

/* ===== VARIÁVEIS ===== */
:root{
  --bg:#071029;
  --card:#0b1a3a;
  --table:#0e224d;
  --table-alt:#0c1d40;
  --header:#2c4078;
  --border:#1e2f5c;
  --text:#f7f9fa;
  --muted:#9fb3ff;
}

/* ===== BASE ===== */
html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:#fff;
  font-family:Inter,Arial;
}

/* ===== CONTAINER GLOBAL ===== */
.container{
  width:100%;
  max-width:1400px;
  margin:0 auto;
  padding:0 10px;
}


header{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  padding:12px;
  background:#020617;
  border-radius:10px;
  border:1px solid #fff;
  height:90px;
}

.logo{ height:70px; }

.center{text-align:center;}

.title{
  font-size:30px;
  font-weight:700;
}

.right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
}


main{
  padding:12px 0;
  display:grid;
  gap:10px;
}

.card{
  background:var(--card);
}

.card h2{
  text-align:center;
}


table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th, td{
  padding:12px;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.table-container{
  overflow-x:auto;
}

.table-container table{
  min-width:1400px;
}


</style>
</head>

<body>

<audio id="beep" preload="auto">
  <source src="./alerta.mp3" type="audio/mpeg">
</audio>

<div class="container">


<header>

  <img src="logo.png" class="logo" onerror="this.style.display='none'">

  <div class="center">
    <div class="title">MOVIMENTAÇÃO DIÁRIA</div>
    <div id="status-empregados"></div>
  </div>

  <div class="right">
    <div class="clock" id="clock"></div>
    <button id="toggle-audio" onclick="toggleAudio()">🔊 SOM: ON</button>
  </div>

</header>


<main>

  <section class="card">
    <h2>PAINEL</h2>
    <div id="painel">Carregando...</div>
  </section>

  <section class="card">
    <h2>AGENDA DO DIA</h2>
    <div id="agenda">Carregando...</div>
  </section>

  <section class="card">
    <h2>AGENDA SERVIÇO SOCIAL</h2>
    <div id="social">Carregando...</div>
  </section>

</main>

</div>

<div class="small">Atualização automática a cada 30s • Google Sheets</div>


<script>


const SHEET_ID = "1Ch3AjQ0MDo4WuQWFDR3r8nZrHb4yQkSLOtT5_QgxT6E";

const TABS = [
  { id:"painel", name:"PAINEL" },
  { id:"agenda", name:"AGENDA DO DIA" },
  { id:"social", name:"AGENDA SERVIÇO SOCIAL" }
];


const parseGviz = t =>
  JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1));

const escapeHtml = s =>
  String(s ?? "").replace(/[&<>]/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;"
  }[m]));


function renderTable(id, g){
  const el = document.getElementById(id);

  let h="<div class='table-container'><table>";

  g.table.rows.forEach(r=>{
    h+="<tr>";
    (r.c||[]).forEach(c=>{
      h+=`<td>${escapeHtml(c?.f ?? c?.v ?? "")}</td>`;
    });
    h+="</tr>";
  });

  h+="</table></div>";

  el.innerHTML = h;
}


async function fetchSheet(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${tab}&tqx=out:json`;
  const r = await fetch(url);
  return parseGviz(await r.text());
}


async function loadAll(){
  const results = await Promise.all(TABS.map(t=>fetchSheet(t.name)));

  renderTable("painel", results[0]);
  renderTable("agenda", results[1]);
  renderTable("social", results[2]);
}


loadAll();
setInterval(loadAll,10000);


</script>
</body>
</html>
