<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel Frota</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2>🚚 Frota</h2>

  <button onclick="App.load('Planilha1')">Agenda Dia</button>
  <button onclick="App.load('Planilha2')">Serviço Social</button>

  <hr>

  <input type="date" id="fData">
  <select id="fTipo">
    <option value="all">Todas</option>
    <option value="Planilha1">Dia</option>
    <option value="Planilha2">Social</option>
  </select>

  <button onclick="App.filtrar()">🔍 Filtrar</button>

</aside>

<!-- MAIN -->
<main class="main">

  <!-- TOPBAR -->
  <div class="topbar">
    <h2 id="titulo"></h2>

    <div>
      <button class="btn primary" onclick="UI.openForm()">➕ Novo</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</main>

<!-- MODAL -->
<div class="modal hidden" id="modal">
  <div class="modal-box">

    <h3 id="formTitle"></h3>

    <div id="formFields"></div>

    <div class="actions">
      <button class="btn primary" onclick="UI.save()">Salvar</button>
      <button class="btn" onclick="UI.closeForm()">Cancelar</button>
    </div>

  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
